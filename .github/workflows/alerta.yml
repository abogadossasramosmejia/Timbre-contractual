name: Alerta contratos Alcaldía de Cúcuta

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (minuto 17, hora UTC)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write           # para guardar estado.json en el repositorio
  issues: write             # para publicar el aviso (GitHub lo envía por correo)

concurrency:
  group: alerta-contratos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar SECOP II y enviar alerta
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      - name: Guardar contratos ya notificados
        run: |
          git config user.name "alerta-contratos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "Actualizar estado de contratos notificados"
            git push
          fi
